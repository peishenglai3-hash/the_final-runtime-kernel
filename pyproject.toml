[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-final-runtime"
version = "0.1.0"
description = "A minimal evidence-grounded relational runtime for friction-aware adaptation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Lai Peisheng" }]
dependencies = []

[project.scripts]
tfrk = "tfrk.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
